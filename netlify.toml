[build]
  publish = "."
  command = "node -e 'const fs=require(\"fs\");const url=(process.env.NEXT_PUBLIC_BUSINESS_OS_URL||process.env.VITE_BUSINESS_OS_URL||process.env.PUBLIC_BUSINESS_OS_URL||process.env.BUSINESS_OS_URL||\"https://app.serguides.fr\").replace(/\\/+$/,\"\");fs.writeFileSync(\"config.js\",\"window.BUSINESS_OS_URL = \"+JSON.stringify(url)+\";\\n\");'"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://app.serguides.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.serguides.fr"
